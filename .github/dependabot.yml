# Weekly update proposals (blueprint 5.4): packages and the CI actions.
# Each arrives as a pull request that must pass CI; nothing merges itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Only versions published at least 7 days ago: a new release that turns
    # out to be malicious or broken is usually pulled within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates in one PR per week; majors one by one.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
