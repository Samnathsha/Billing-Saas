name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

# Third-party actions are pinned to a full commit SHA (with the version in a
# comment), so a moved or hijacked tag cannot change what runs here.

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Migration files are consistent
        run: npm run db:check

  database:
    name: Database tests and check-rls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # A throwaway PostgreSQL that exists only for this job. Same major
      # version as Neon. Pinned by digest like the actions above.
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_DB: billing_test
          # No passwords: the server is reachable only from this job and is
          # deleted when it ends. Roles and RLS behave exactly as on Neon.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL_TEST: postgresql://app_user@localhost:5432/billing_test
      MIGRATOR_DATABASE_URL_TEST: postgresql://migrator@localhost:5432/billing_test
      AUTH_DATABASE_URL_TEST: postgresql://auth_service@localhost:5432/billing_test
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Random auth secret for this run (masked)
        run: |
          secret="$(openssl rand -base64 32)"
          # Reviewed (Phase 11): a random throwaway value, never input from a user.
          echo "::add-mask::$secret" # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Create roles (scripts/db-roles.sql, as on Neon)
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d billing_test -v ON_ERROR_STOP=1 < scripts/db-roles.sql
      - name: Run migrations as migrator
        run: npm run db:migrate:test
      - name: check-rls
        run: npm run db:check-rls
      - name: Database tests (isolation, withTenant, append-only)
        run: npm run test:db

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholder so the startup settings check passes. Not a secret: no
      # password, and no test here touches a database yet.
      DATABASE_URL_DEV: postgres://localhost:5432/ci_placeholder
      AUTH_DATABASE_URL_DEV: postgres://localhost:5432/ci_placeholder_auth
      BETTER_AUTH_URL: http://localhost:3100
      # Production mode requires email settings; browser tests send no email.
      RESEND_API_KEY: re_ci_placeholder_never_used
      EMAIL_FROM: ci@example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Random auth secret for this run (masked)
        run: |
          secret="$(openssl rand -base64 32)"
          # Reviewed (Phase 11): a random throwaway value, never input from a user.
          echo "::add-mask::$secret" # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Policy: docs/decisions/0001-npm-audit-policy.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Packages the live app uses (fails the build, except reviewed allow-list entries)
        run: npm run audit:runtime
      - name: Developer tools (report only)
        run: |
          if ! npm audit; then
            echo "::warning title=npm audit (dev tools)::Developer-tool vulnerabilities found. See ADR 0001; review them, but they do not fail the build."
          fi

  container:
    name: Container builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (no settings inside)
        run: docker build -t billing:ci .
      - name: Without settings it refuses to start
        run: |
          if docker run --rm billing:ci; then echo "started without settings" && exit 1; fi
      - name: With (made-up) settings it serves /api/health
        run: |
          docker run -d --name app -p 3000:3000 \
            -e DATABASE_URL_DEV=postgresql://app_user@db.invalid/none \
            -e AUTH_DATABASE_URL_DEV=postgresql://auth_service@db.invalid/none \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e RESEND_API_KEY=re_ci_not_a_real_key \
            -e EMAIL_FROM="CI <ci@test.invalid>" \
            billing:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health | grep -q '"ok"'; then echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1

  semgrep:
    name: Code scan (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install Semgrep (pinned version)
        run: python -m pip install "semgrep==1.136.0"
      - name: Scan with the community security rules (fails on any finding)
        run: >
          semgrep scan --error --metrics=off
          --config p/javascript --config p/typescript --config p/react --config p/nextjs
          --config p/owasp-top-ten --config p/secrets --config p/github-actions --config p/dockerfile
          src scripts tests .github drizzle Dockerfile

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret deleted later is still leaked
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum --check --strict
          tar -xzf "$file" gitleaks
      - name: Scan the whole git history
        run: ./gitleaks git --redact --ignore-gitleaks-allow --no-banner --verbose .
