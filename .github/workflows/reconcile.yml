# Daily reconciliation (Phase 12; docs/runbook.md): bills against lines,
# payments, stock and customer accounts, for every business. Read-only
# (backup_reader). 04:00 India time. A mismatch fails the run, which emails
# the repository owner. Uses the backup secret; until it exists it only
# says so.
name: Reconcile

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Is it set up?
        id: setup
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then
            echo "::notice title=Reconciliation not set up yet::Add the BACKUP_DATABASE_URL secret (docs/backups.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.setup.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: "24"
          cache: npm
      - if: steps.setup.outputs.ready == 'true'
        run: npm ci --ignore-scripts
      - name: Reconcile yesterday and all history
        if: steps.setup.outputs.ready == 'true'
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: npx tsx scripts/reconcile.ts prod
